[project]
name = "jianfill-mail-host"
version = "0.4.3"
description = "Native Messaging host for Jianfill recruitment email tasks."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "dateparser>=1.2,<2",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "cryptography>=42,<46",
  "playwright>=1.46,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "respx>=0.21,<1",
]

[project.scripts]
job-email-assistant = "job_email_assistant.cli:main"
jianfill-mail-host = "job_email_assistant.native_host:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
