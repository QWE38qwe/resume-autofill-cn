const Demo = (() => {

    const date = value instanceof Date ? value : new Date(`${value}T12:00:00`);
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
  }
  function offsetDay(value, offset) {
    const date = new Date(`${dayKey(value)}T12:00:00`);

  }
  const ANSWER_FIELDS = {salary:"期望薪资",summary:"个人简介",role:"申请岗位",city:"当前城市"};
  function defaultSettings(versionId="v1") {
    return {
      ai:{optionMatching:false,providers:[{id:"model-demo",name:"产品分析模型",model:"demo-chat",apiBase:"https://api.example.com/v1",enabled:true}]},
      fill:{defaultVersionId:versionId,overwriteExisting:false,animate:true,rules:[{id:"rule-salary",field:"salary",answer:"根据岗位职责与公司薪酬体系协商",enabled:false}]},
      mail:{address:"zhiyao.lin@example.com",host:"imap.example.com",port:993,autoSync:false,intervalHours:12,lookbackHours:24,lastSync:null}

  function validSettings(settings) {

    const today = dayKey(now);
    const personal = {

async function mockMailSync() {

  for(const key of Object.keys(fillSession.classes))fillSession.classes[key]=`field fill-field ${key==="summary"||key==="salary"?"full":""} ${values[key]?"scanned":"manual"}`;
  const missing=simulationFields.filter(([key])=>!values[key]);
  const count=simulationFields.length-missing.length;
  fillSession.feedback=`识别到 <strong>${simulationFields.length}</strong> 个字段，<strong>${count}</strong> 个有可用资料。${missing.length?missing.map(([,label])=>esc(label.split(" · ")[0])).join("、")+"需要手动填写。":"所有字段都有可用资料。"}`;
  render();
}
async function simulateFill(){if(fillStage!==1)return;captureFill();if(!fillSnapshot)fillSnapshot=clone(fillSession);const plan=Demo.planFill(fillSession.values,Demo.fillValues(state,fillSession.versionId),fillSession.overwrite);const run=++fillRun;fillStage=2;render();let written=0,skipped=0,manual=0;for(const item of plan){if(state.settings.fill.animate&&!matchMedia("(prefers-reduced-motion: reduce)").matches)await new Promise(resolve=>setTimeout(resolve,65));if(run!==fillRun||view!=="simulation")return;const input=document.querySelector(`[data-fill="${item.key}"]`);if(!input)return;input.closest(".field").classList.remove("filled","scanned","manual");if(item.status==="filled"){input.value=item.value;input.closest(".field").classList.add("filled");written++;}else if(item.status==="skipped"){skipped++;}else{input.closest(".field").classList.add("manual");manual++;}$("#fillFeedback").textContent=`正在匹配与填入… ${written+skipped+manual} / ${plan.length}`;}$("#fillFeedback").innerHTML=`<strong>填写完成</strong><br>${written} 项已填入 · ${skipped} 项保留原值 · ${manual} 项待手动填写。<br>检查右侧结果后，可撤销或重新体验。`;captureFill();fillStage=3;render();notify("资料已填入模拟表单，可继续编辑或撤销。");}

document.addEventListener("change",event=>{const target=event.target;
  if(target.id==="backupFile"){const file=target.files?.[0];target.value="";if(file)readBackup(file);return;}
  if(target.dataset.settingToggle){const checked=target.checked,id=target.dataset.id,kind=target.dataset.settingToggle;commit(next=>{if(kind==="ai")next.settings.ai.optionMatching=checked;if(kind==="provider"){const provider=next.settings.ai.providers.find(item=>item.id===id);if(provider)provider.enabled=checked;}if(kind==="answer"){const rule=next.settings.fill.rules.find(item=>item.id===id);if(rule)rule.enabled=checked;}},"设置已保存。");return;}
if(target.id==="appStage"){appStage=target.value;render();}if(target.id==="mailStatus"){mailStatus=target.value;render();}if(target.id==="fillVersion"){captureFill();fillStage=0;fillSession.classes={};fillSession.feedback="已切换简历版本，请重新识别字段。已有表单内容会保留。";render();}if(target.matches('[name="workIds"],[name="projectIds"]')){const form=target.closest("form");const key=target.name==="workIds"?"workOrder":"projectOrder";let order=JSON.parse(form.dataset[key]);order=order.filter(id=>id!==target.value);if(target.checked)order.push(target.value);form.dataset[key]=JSON.stringify(order);redrawVersionOptions(form,target.name,order);}});
document.addEventListener("submit",event=>{const form=event.target;if(form.id==="simulationForm"){event.preventDefault();return;}if(!form.dataset.form)return;event.preventDefault();for(const input of form.querySelectorAll("[required]")){if(!input.value.trim()){input.setCustomValidity("请填写内容，不能只包含空格。");input.reportValidity();input.addEventListener("input",()=>input.setCustomValidity(""),{once:true});return;}}const data=new FormData(form);const values=Object.fromEntries([...data.entries()].map(([key,value])=>[key,String(value).trim()]));const type=form.dataset.form;

  if(type==="fill-settings"){
    commit(next=>{next.settings.fill.defaultVersionId=values.defaultVersionId;next.settings.fill.overwriteExisting=data.has("overwriteExisting");next.settings.fill.animate=data.has("animate");activeVersion=values.defaultVersionId;if(fillSession){fillSession.versionId=values.defaultVersionId;fillSession.overwrite=next.settings.fill.overwriteExisting;fillSession.classes={};fillSession.feedback="填写偏好已更新，请重新识别字段。";fillStage=0;fillSnapshot=null;}},"填写偏好已保存。");return;
  }

    const mail={...state.settings.mail,address:values.address,host:values.host,port:Number(values.port),intervalHours:Number(values.intervalHours),lookbackHours:Number(values.lookbackHours),autoSync:data.has("autoSync")};

  }
  if(type==="provider"){
    try{if(!["http:","https:"].includes(new URL(values.apiBase).protocol))throw Error();}catch{notify("请填写有效的 HTTP(S) API 地址。");return;}
    commit(next=>{const current=next.settings.ai.providers.find(provider=>provider.id===form.dataset.id);if(current)Object.assign(current,{name:values.name,model:values.model,apiBase:values.apiBase});else next.settings.ai.providers.push({id:newId("model"),name:values.name,model:values.model,apiBase:values.apiBase,enabled:true});},"演示模型已保存。");closeDrawer();return;
  }
  if(type==="answer"){
    if(state.settings.fill.rules.some(rule=>rule.field===values.field&&rule.id!==form.dataset.id)){notify("该字段已有规则，请编辑现有规则。");return;}
    commit(next=>{const current=next.settings.fill.rules.find(rule=>rule.id===form.dataset.id);if(current)Object.assign(current,{field:values.field,answer:values.answer});else next.settings.fill.rules.push({id:newId("rule"),field:values.field,answer:values.answer,enabled:true});},"回答规则已保存。");closeDrawer();return;
  }
  if(values.start&&values.end&&values.start>values.end){notify("结束时间不能早于开始时间。");return;}
  if(type==="todo"){commit(next=>next.todos.push({id:newId("todo"),date:selectedDay,text:values.text,completed:false}),"已添加当天 Todo。");return;}
  if(type==="personal"){commit(next=>{for(const [key] of profileFields[form.dataset.key])next.personal[key]=values[key]||"";},"资料已保存，简历预览已同步。");}
  if(type==="custom"){commit(next=>{next.personal.customFields=[{name:values.name,value:values.value,alias:values.alias}];},"自定义字段已保存。");}
  if(type==="record"){const kind=form.dataset.kind;commit(next=>{const current=next[kind].find(item=>item.id===form.dataset.id);if(current)Object.assign(current,values);else next[kind].push({id:newId(kind),...values});},"经历已保存。");}
  if(type==="version"){const workIds=JSON.parse(form.dataset.workOrder).filter(id=>data.getAll("workIds").includes(id));const projectIds=JSON.parse(form.dataset.projectOrder).filter(id=>data.getAll("projectIds").includes(id));const id=form.dataset.id||newId("version");commit(next=>{const payload={id,name:values.name,direction:values.direction,summary:values.summary,notes:values.notes,workIds,projectIds,updatedAt:today};const index=next.versions.findIndex(version=>version.id===id);if(index>=0)next.versions[index]=payload;else next.versions.push(payload);activeVersion=id;},"简历版本已保存。");}
  if(type==="application"){commit(next=>{const existing=next.applications.find(app=>app.id===form.dataset.id);if(existing){if(existing.stage!==values.stage)existing.history.push({stage:values.stage,date:today});Object.assign(existing,values);if(existing.history[0])existing.history[0].date=values.date;for(const task of next.tasks){if(task.applicationId===existing.id)task.company=existing.company;}}else next.applications.unshift({id:newId("app"),...values,history:[{stage:values.stage,date:values.date}]});},"投递记录已保存，统计已更新。");}
  if(type==="task"){commit(next=>{const application=next.applications.find(app=>app.id===values.applicationId);if(!application)return;const payload={...values,company:application.company,completed:values.completed==="true"};const existing=next.tasks.find(task=>task.id===form.dataset.id);if(existing)Object.assign(existing,payload);else next.tasks.push({id:newId("task"),...payload,receivedAt:today,body:"手动添加的示例招聘待办。"});},"待办安排已保存。");}
  closeDrawer();
});
document.addEventListener("keydown",event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==="k"){event.preventDefault();if(!$("#drawer").open&&!$("#confirmDialog").open)actions.search();}if(event.key==="Enter"&&event.target.matches("tr[data-action]")){event.preventDefault();actions[ event.target.dataset.action ](event.target);}if(event.key==="Escape")actions["close-menu"]();});
for(const dialog of document.querySelectorAll("dialog"))dialog.addEventListener("click",event=>{if(event.target!==dialog)return;const bounds=dialog.getBoundingClientRect();if(event.clientX<bounds.left||event.clientX>bounds.right||event.clientY<bounds.top||event.clientY>bounds.bottom)dialog.close();});
window.addEventListener("hashchange",()=>{const route=location.hash.slice(1);if(Object.hasOwn(names,route))go(route);});
$("#resetIcon").innerHTML=icon("refresh",14);$("#menuIcon").innerHTML=icon("menu",18);$("#searchTrigger").innerHTML=`${icon("search",14)}<span>搜索工作台</span><kbd>Ctrl K</kbd>`;$("#searchDialogIcon").innerHTML=icon("search",18);$("#saveIndicator").innerHTML=`<span class="dot"></span>${persistence?"已保存在本机":"仅本次会话"}`;
render(true);
if(storageWarning)setTimeout(()=>notify(storageWarning),500);
})();
</script>
</body>
</html>
