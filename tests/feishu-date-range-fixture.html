<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Feishu ATSX date range fixture</title>
  <style>
    body { font: 16px sans-serif; }
    section, .record { margin: 20px; padding: 16px; border: 1px solid #ccc; }
    label { display: block; margin: 8px 0; }
    input, textarea { padding: 8px; }
    .atsx-select { display: inline-block; min-width: 240px; padding: 8px; border: 1px solid #999; cursor: pointer; }
    .atsx-select-dropdown { position: fixed; z-index: 20; min-width: 240px; padding: 4px; background: white; border: 1px solid #333; }
    .atsx-select-dropdown-menu-item { padding: 6px; cursor: pointer; }
    .atsx-calendar-picker { display: inline-block; padding: 4px; border: 1px solid #999; }
    .atsx-calendar-range { display: flex; position: fixed; inset: 60px auto auto 60px; z-index: 10; background: white; border: 1px solid #333; }
    .atsx-calendar-range[hidden] { display: none; }
    .atsx-calendar-range-part { width: 260px; padding: 12px; }
    .atsx-calendar-month-panel-cell { display: inline-block; width: 25%; padding: 6px 0; text-align: center; }
    .atsx-calendar-month-panel-month { cursor: pointer; }
  </style>
</head>
<body>
  <section id="education">
    <h2>教育经历</h2>
    <div class="record education-record">
      <label>学校名称<input value="已有大学"></label>
      <label>学历
        <span class="atsx-select" data-select="degree">
          <span class="atsx-select-selection__placeholder">请选择</span>
          <span class="atsx-select-selection-selected-value"></span>
        </span>
      </label>
      <label>专业<input value="已有专业"></label>
      <label>起止时间
        <span class="atsx-calendar-picker" data-range="education">
          <input class="atsx-calendar-range-picker-input atsx-calendar-range-picker-input-left" value="2024-07" readonly>
          <span class="atsx-calendar-range-picker-separator">至</span>
          <input class="atsx-calendar-range-picker-input atsx-calendar-range-picker-input-right" readonly>
        </span>
      </label>
      <label>学历类型
        <span class="atsx-select" data-select="education-type">
          <span class="atsx-select-selection__placeholder">请选择</span>
          <span class="atsx-select-selection-selected-value"></span>
        </span>
      </label>
      <label>成绩排名
        <span class="atsx-select" data-select="rank">
          <span class="atsx-select-selection__placeholder">请选择</span>
          <span class="atsx-select-selection-selected-value"></span>
        </span>
      </label>
      <label>是否双学位
        <span class="atsx-select" data-select="double-degree">
          <span class="atsx-select-selection__placeholder">请选择</span>
          <span class="atsx-select-selection-selected-value"></span>
        </span>
      </label>
      <label>是否MBA
        <span class="atsx-select" data-select="mba">
          <span class="atsx-select-selection__placeholder">请选择</span>
          <span class="atsx-select-selection-selected-value"></span>
        </span>
      </label>
    </div>
  </section>

  <section id="work">
    <h2>工作经历</h2>
    <div class="record work-record">
      <label>公司名称<input placeholder="请输入公司名称"></label>
      <label>职位名称<input placeholder="请输入职位名称"></label>
      <label>起止时间
        <span class="atsx-calendar-picker" data-range="work-0">
          <input class="atsx-calendar-range-picker-input atsx-calendar-range-picker-input-left" placeholder="开始时间" readonly>
          <span class="atsx-calendar-range-picker-separator">至</span>
          <input class="atsx-calendar-range-picker-input atsx-calendar-range-picker-input-right" placeholder="结束时间" readonly>
        </span>
      </label>
      <label><input type="checkbox" class="current-work">我当前在这工作</label>
      <label>描述<textarea></textarea></label>
    </div>
    <div class="record work-record">
      <label>公司名称<input placeholder="请输入公司名称"></label>
      <label>职位名称<input placeholder="请输入职位名称"></label>
      <label>起止时间
        <span class="atsx-calendar-picker" data-range="work-1">
          <input class="atsx-calendar-range-picker-input atsx-calendar-range-picker-input-left" placeholder="开始时间" readonly>
          <span class="atsx-calendar-range-picker-separator">至</span>
          <input class="atsx-calendar-range-picker-input atsx-calendar-range-picker-input-right" placeholder="结束时间" readonly>
        </span>
      </label>
      <label><input type="checkbox" class="current-work">我当前在这工作</label>
      <label>描述<textarea></textarea></label>
    </div>
  </section>

  <div class="atsx-calendar-range" hidden>
    <div class="atsx-calendar-range-part atsx-calendar-range-left"></div>
    <div class="atsx-calendar-range-part atsx-calendar-range-right"></div>
  </div>
  <button id="run-fixture" type="button">运行夹具</button>
  <pre id="result">not-run</pre>

  <script>
    const fixtureStore = {
      personal: {},
      education: [{
        school: "应保留的新大学",
        major: "应保留的新专业",
        level: "硕士研究生",
        type: "全日制",
        rank: "专业排名前10%",
        doubleDegree: "是",
        mba: "否",
        start: "2024-07",
        end: "2027-06"
      }],
      profiles: [{
        id: "fixture-profile",
        name: "测试简历",
        work: [{
          company: "甲公司",
          position: "产品经理",
          start: "2023-04",
          end: "2024-08",
          description: "第一段经历"
        }, {
          company: "乙公司",
          position: "产品实习生",
          start: "2025-01",
          end: "至今",
          current: true,
          description: "第二段经历"
        }]
      }],
      activeProfileId: "fixture-profile",
      projects: [],
      languages: [],
      skills: [],
      awards: [],
      papers: [],
      certificates: [],
      portfolio: [],
      customFields: [],
      settings: {}
    };

    let contentListener;
    let activePicker = null;
    let activeSelect = null;
    let phase = "start";
    const overlay = document.querySelector(".atsx-calendar-range");

    window.chrome = {
      storage: {
        local: {
          get: async keys => Object.fromEntries(keys.map(key => [key, fixtureStore[key]]))
        }
      },
      runtime: {
        sendMessage: async () => ({ matches: [], source: "disabled" }),
        onMessage: {
          addListener: listener => {
            contentListener = listener;
          }
        }
      }
    };

    function renderPanel(side, year) {
      const part = overlay.querySelector(`.atsx-calendar-range-${side}`);
      part.dataset.year = String(year);
      part.innerHTML = `
        <div class="atsx-calendar-month-panel">
          <button class="atsx-calendar-month-panel-prev-year-btn" type="button">上一年</button>
          <span class="atsx-calendar-month-panel-year-select">${year}年</span>
          <button class="atsx-calendar-month-panel-next-year-btn" type="button">下一年</button>
          <div>${Array.from({ length: 12 }, (_, index) => `
            <span class="atsx-calendar-month-panel-cell">
              <span class="atsx-calendar-month-panel-month">${index + 1}月</span>
            </span>`).join("")}
          </div>
        </div>`;
      part.querySelector(".atsx-calendar-month-panel-prev-year-btn").onclick = () => renderPanel(side, year - 1);
      part.querySelector(".atsx-calendar-month-panel-next-year-btn").onclick = () => renderPanel(side, year + 1);
      part.querySelectorAll(".atsx-calendar-month-panel-month").forEach((month, index) => {
        month.onclick = () => {
          const inputs = activePicker.querySelectorAll(".atsx-calendar-range-picker-input");
          if (phase === "start") {
            inputs[0].value = `${year}-${String(index + 1).padStart(2, "0")}`;
            phase = "end";
          } else {
            inputs[1].value = `${year}-${String(index + 1).padStart(2, "0")}`;
            overlay.hidden = true;
          }
          inputs.forEach(input => input.dispatchEvent(new Event("change", { bubbles: true })));
        };
      });
    }

    document.querySelectorAll(".atsx-calendar-picker").forEach(picker => {
      picker.onclick = () => {
        activePicker = picker;
        phase = picker.querySelector(".atsx-calendar-range-picker-input-left").value ? "end" : "start";
        renderPanel("left", 2026);
        renderPanel("right", 2027);
        overlay.hidden = false;
      };
    });
    const selectOptions = {
      degree: ["博士", "MBA", "硕士", "本科", "大专", "高中", "其他"],
      "education-type": ["海外及港澳台", "统招全日制", "统招非全日制", "自考", "其他"],
      rank: ["前 5%", "前10%（含）", "前 20%", "前 30%", "前 50%", "其他"],
      "double-degree": ["是", "否"],
      mba: ["是", "否"]
    };
    document.querySelectorAll(".atsx-select").forEach(select => {
      select.onclick = () => {
        activeSelect = select;
        document.querySelector(".atsx-select-dropdown")?.remove();
        const dropdown = document.createElement("div");
        const rect = select.getBoundingClientRect();
        dropdown.className = "atsx-select-dropdown";
        dropdown.style.left = `${rect.left}px`;
        dropdown.style.top = `${rect.bottom + 2}px`;
        selectOptions[select.dataset.select].forEach(value => {
          const option = document.createElement("div");
          option.className = "atsx-select-dropdown-menu-item";
          option.textContent = value;
          option.onclick = event => {
            event.stopPropagation();
            activeSelect.querySelector(".atsx-select-selection-selected-value").textContent = value;
            activeSelect.querySelector(".atsx-select-selection__placeholder")?.remove();
            dropdown.remove();
          };
          dropdown.append(option);
        });
        document.body.append(dropdown);
      };
    });
    document.querySelectorAll(".current-work").forEach(checkbox => {
      checkbox.addEventListener("click", () => {
        checkbox.dataset.clicks = String(Number(checkbox.dataset.clicks || 0) + 1);
      });
      checkbox.onchange = () => {
        if (!checkbox.checked) return;
        checkbox.closest(".record").querySelector(".atsx-calendar-range-picker-input-right").value = "至今";
        overlay.hidden = true;
      };
    });

    window.runFeishuDateRangeFixture = () => new Promise((resolve, reject) => {
      if (!contentListener) {
        reject(new Error("content listener not registered"));
        return;
      }
      contentListener({ type: "FILL_FORM", mode: "supplement" }, {}, response => {
        const educationDates = [...document.querySelectorAll(
          ".education-record .atsx-calendar-range-picker-input"
        )].map(input => input.value);
        const workDates = [...document.querySelectorAll(".work-record")].map(record =>
          [...record.querySelectorAll(".atsx-calendar-range-picker-input")].map(input => input.value)
        );
        const educationChoices = Object.fromEntries(
          [...document.querySelectorAll(".education-record .atsx-select")].map(select => [
            select.dataset.select,
            select.querySelector(".atsx-select-selection-selected-value").textContent
          ])
        );
        const result = {
          response,
          educationDates,
          educationChoices,
          workDates,
          current: document.querySelectorAll(".current-work")[1].checked,
          currentClicks: [...document.querySelectorAll(".current-work")].map(
            checkbox => Number(checkbox.dataset.clicks || 0)
          )
        };
        result.pass =
          educationDates[0] === "2024-07" &&
          educationDates[1] === "2027-06" &&
          educationChoices.degree === "硕士" &&
          educationChoices["education-type"] === "统招全日制" &&
          educationChoices.rank === "前10%（含）" &&
          educationChoices["double-degree"] === "是" &&
          educationChoices.mba === "否" &&
          workDates[0][0] === "2023-04" &&
          workDates[0][1] === "2024-08" &&
          workDates[1][0] === "2025-01" &&
          workDates[1][1] === "至今" &&
          result.current;
        document.querySelector("#result").textContent = JSON.stringify(result, null, 2);
        resolve(result);
      });
    });
  </script>
  <script src="../content.js"></script>
  <script>
    document.querySelector("#run-fixture").addEventListener("click", () => {
      window.runFeishuDateRangeFixture().catch(error => {
        document.querySelector("#result").textContent = JSON.stringify({
          error: error.message
        });
      });
    });
  </script>
</body>
</html>
